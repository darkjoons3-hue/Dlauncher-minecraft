name: Build Installer
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile Installer
        run: |
          rc resource.rc
          cl /nologo /EHsc /O2 /MT /utf-8 /DUNICODE /D_UNICODE Installer.cpp resource.res /Fe:DlauncherSetup.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib ole32.lib
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: DlauncherSetup.exe
